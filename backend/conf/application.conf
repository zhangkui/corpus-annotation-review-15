# ==========================================================================
# 多语言语料标注冲突审查系统 — Play 3 配置
# ==========================================================================

play.modules.enabled += "Module"

play.http.secret.key = "dev-only-secret-change-me"
play.http.secret.key = ${?PLAY_SECRET}

# 允许所有 Host（容器内由 nginx 反代）
play.filters.hosts.allowed = ["."]

# CORS：开发期放开，生产可收紧
play.filters.enabled += "play.filters.cors.CORSFilter"
play.filters.cors {
  pathPrefixes = ["/api"]
  allowedOrigins = null
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowedHttpHeaders = ["Accept", "Content-Type", "Authorization"]
  preflightMaxAge = 1 hour
}

# ---------------------------------------------------------------------------
# TimescaleDB (PostgreSQL 16)
# ---------------------------------------------------------------------------
db.default.driver = org.postgresql.Driver
db.default.url = "jdbc:postgresql://localhost:5432/corpus"
db.default.url = ${?DB_JDBC_URL}
db.default.username = "corpus"
db.default.username = ${?DB_USER}
db.default.password = "corpus"
db.default.password = ${?DB_PASSWORD}
db.default.hikaricp.maximumPoolSize = 10
db.default.hikaricp.connectionTimeout = 10 seconds

# ---------------------------------------------------------------------------
# RabbitMQ 3.13
# ---------------------------------------------------------------------------
rabbitmq {
  host = "localhost"
  host = ${?RABBITMQ_HOST}
  port = 5672
  port = ${?RABBITMQ_PORT}
  username = "guest"
  username = ${?RABBITMQ_USER}
  password = "guest"
  password = ${?RABBITMQ_PASSWORD}
  exchange = "corpus.events"
  eventQueue = "event-log"
}
